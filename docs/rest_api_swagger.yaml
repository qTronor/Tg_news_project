  /analytics/datasets/{datasetId}/validation:
    get:
      tags: [datasets]
      summary: Get latest dataset validation report
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: task_type
          in: query
          schema:
            type: string
            enum: [topic_classification, sentiment_classification, embedding_finetuning, ner_finetuning]
      responses:
        "200": { description: Validation report }
    post:
      tags: [datasets]
      summary: Validate dataset for a training task
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_type]
              properties:
                task_type:
                  type: string
                  enum: [topic_classification, sentiment_classification, embedding_finetuning, ner_finetuning]
      responses:
        "200": { description: Validation report }

  /analytics/training/jobs/preview:
    post:
      tags: [training]
      summary: Preview training plan without creating a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id, task_type]
              properties:
                dataset_id: { type: string, format: uuid }
                task_type:
                  type: string
                  enum: [topic_classification, sentiment_classification, embedding_finetuning, ner_finetuning]
                base_model: { type: string }
                training_config: { type: object }
      responses:
        "200": { description: Training plan preview }

  /analytics/training/jobs:
    get:
      tags: [training]
      summary: List training jobs
      responses:
        "200": { description: Training jobs }
    post:
      tags: [training]
      summary: Create training job after explicit consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id, task_type, base_model, consent_to_train]
              properties:
                dataset_id: { type: string, format: uuid }
                task_type:
                  type: string
                  enum: [topic_classification, sentiment_classification, embedding_finetuning, ner_finetuning]
                base_model: { type: string }
                training_config: { type: object }
                consent_to_train: { type: boolean, enum: [true] }
      responses:
        "201": { description: Training job created }
        "400": { description: Missing consent or invalid dataset }

  /analytics/training/jobs/{jobId}:
    get:
      tags: [training]
      summary: Get training job detail
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Training job detail }

  /analytics/training/jobs/{jobId}/logs:
    get:
      tags: [training]
      summary: Get training job logs
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Training job logs }

  /analytics/training/jobs/{jobId}/cancel:
    post:
      tags: [training]
      summary: Cancel queued or running training job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Cancelled job }

  /analytics/models:
    get:
      tags: [models]
      summary: List model registry entries
      responses:
        "200": { description: Model versions }

  /analytics/models/current:
    get:
      tags: [models]
      summary: Get current production model by type
      parameters:
        - name: model_type
          in: query
          required: true
          schema:
            type: string
            enum: [topic_classifier, sentiment_classifier, embedding_model, ner_model]
      responses:
        "200": { description: Current deployed model }

  /analytics/models/{modelId}:
    get:
      tags: [models]
      summary: Get model card
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Model card }

  /analytics/models/{modelId}/accept:
    post:
      tags: [models]
      summary: Mark candidate model accepted
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Accepted model }

  /analytics/models/{modelId}/reject:
    post:
      tags: [models]
      summary: Mark candidate model rejected
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Rejected model }

  /analytics/models/{modelId}/deploy:
    post:
      tags: [models]
      summary: Deploy model after explicit deploy consent
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_to_deploy]
              properties:
                consent_to_deploy: { type: boolean, enum: [true] }
                actor_role: { type: string, enum: [admin, ml_engineer, owner] }
      responses:
        "200": { description: Deployed model }
        "400": { description: Missing consent or blocked deployment }

  /analytics/models/{modelId}/rollback:
    post:
      tags: [models]
      summary: Roll back deployed model to previous version
      parameters:
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Rolled back model }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Channel:
      name: channel
      in: query
      schema:
        type: string
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema:
        type: string
    EntityId:
      name: entityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewTaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    EnrichmentType:
      name: enrichmentType
      in: path
      required: true
      schema:
        type: string
        enum: [cluster_summary, cluster_explanation, key_actors_summary, novelty_explanation, timeline_summary, what_changed_recently]
    Bucket:
      name: bucket
      in: query
      schema:
        type: string
        enum: [hour, day]
        default: hour
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
        enum: [messages, importance, recency]
        default: messages
    MinImportance:
      name: min_importance
      in: query
      schema:
        type: number
        minimum: 0
        maximum: 1
    ImportanceLevel:
      name: importance_level
      in: query
      description: Comma-separated levels, e.g. high,critical
      schema:
        type: string

  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefreshRequest"
    TopicReviewAction:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TopicReviewActionRequest"

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OkResponse"
    OkTask:
      description: OK with task ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OkTaskResponse"
    Detail:
      description: Detail message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  schemas:
    AnyObject:
      type: object
      additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
    ErrorResponse:
      type: object
      properties:
        detail:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/AnyObject"
    ApiErrorResponse:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
        detail:
          type: string
        meta:
          $ref: "#/components/schemas/AnyObject"
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    OkTaskResponse:
      type: object
      properties:
        ok:
          type: boolean
        task_id:
          type: string
    IdStatusResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    StatusResponse:
      type: object
      properties:
        status:
          type: string
      additionalProperties: true

    OverviewStats:
      type: object
      required: [total_messages, messages_change_pct, new_topics, topics_change, active_channels, avg_sentiment]
      properties:
        total_messages:
          type: integer
        messages_change_pct:
          type: number
        new_topics:
          type: integer
        topics_change:
          type: integer
        active_channels:
          type: integer
        avg_sentiment:
          type: number

    Message:
      type: object
      required: [event_id, channel, message_id, text, date, views, forwards]
      properties:
        event_id:
          type: string
        channel:
          type: string
        message_id:
          type: integer
        permalink:
          type: string
          nullable: true
        text:
          type: string
        date:
          type: string
          format: date-time
        views:
          type: integer
        forwards:
          type: integer
        topic_label:
          type: string
          nullable: true
        cluster_id:
          type: string
          nullable: true
        sentiment_score:
          type: number
        sentiment_label:
          type: string
        sentiment_confidence:
          type: number
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        source_status:
          type: string
          enum: [exact, probable, unknown]
        source_type:
          type: string
        source_confidence:
          type: number
        source_event_id:
          type: string
          nullable: true
        source_channel:
          type: string
          nullable: true

    Entity:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        type:
          type: string
          enum: [PER, ORG, LOC, MISC]
        normalized:
          type: string
        confidence:
          type: number
          nullable: true
        mention_count:
          type: integer
        topic_count:
          type: integer
        channel_count:
          type: integer
        trend_pct:
          type: number
        canonical_name:
          type: string
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/EntityAlias"
        source_model:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        wikidata_id:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        language:
          type: string
          nullable: true

    EntityAlias:
      type: object
      properties:
        alias:
          type: string
        source:
          type: string
        confidence:
          type: number
        is_primary:
          type: boolean
        language:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    EntityTimelinePoint:
      type: object
      properties:
        time:
          type: string
          format: date-time
        mention_count:
          type: integer

    EntityMergeRequest:
      type: object
      required: [target_id]
      properties:
        target_id:
          type: string
          format: uuid
        reason:
          type: string
        actor:
          type: string
          default: api

    EntityMergeResult:
      type: object
      properties:
        source_id:
          type: string
        target_id:
          type: string
        transferred_aliases:
          type: integer
        repointed_ner_results:
          type: integer

    NormalizationRuleInput:
      type: object
      required: [rule_type, pattern]
      properties:
        rule_type:
          type: string
          enum: [alias, abbreviation, regex, merge]
        pattern:
          type: string
        replacement:
          type: string
          nullable: true
        entity_type:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        target_canonical_id:
          type: string
          format: uuid
          nullable: true
        priority:
          type: integer
          default: 100
        created_by:
          type: string
          default: api
    NormalizationRule:
      allOf:
        - $ref: "#/components/schemas/NormalizationRuleInput"
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time

    ChannelStat:
      type: object
      properties:
        channel:
          type: string
        count:
          type: integer

    Topic:
      type: object
      required: [cluster_id, label, message_count, channel_count, avg_sentiment, top_entities, top_keywords, is_new, first_seen, last_seen]
      properties:
        cluster_id:
          type: string
        label:
          type: string
        message_count:
          type: integer
        channel_count:
          type: integer
        avg_sentiment:
          type: number
        top_entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        top_keywords:
          type: array
          items:
            type: string
        is_new:
          type: boolean
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        sparkline:
          type: array
          items:
            type: integer
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelStat"
        source_status:
          type: string
          enum: [exact, probable, unknown]
        importance_score:
          type: number
          nullable: true
        importance_level:
          type: string
          nullable: true
          enum: [low, medium, high, critical]
        score_calculated_at:
          type: string
          format: date-time
          nullable: true
        novelty_score:
          type: number
          nullable: true
        novelty_status:
          type: string
          nullable: true
          enum: [new, continuation, merged, split, uncertain, noise]
        confidence_score:
          type: number
          nullable: true
        stability_score:
          type: number
          nullable: true

    TopicDetail:
      allOf:
        - $ref: "#/components/schemas/Topic"
        - type: object
          properties:
            representative_messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            related_topics:
              type: array
              items:
                $ref: "#/components/schemas/RelatedTopic"
            sentiment_breakdown:
              type: object
              properties:
                positive:
                  type: integer
                neutral:
                  type: integer
                negative:
                  type: integer
            volume_timeline:
              type: array
              items:
                type: object
                properties:
                  time:
                    type: string
                    format: date-time
                  count:
                    type: integer
            first_source:
              $ref: "#/components/schemas/FirstSourcePayload"
            summary:
              type: string
              nullable: true
            score_breakdown:
              $ref: "#/components/schemas/AnyObject"
            novelty:
              $ref: "#/components/schemas/TopicNovelty"

    RelatedTopic:
      type: object
      properties:
        cluster_id:
          type: string
        label:
          type: string
        similarity:
          type: number

    TopicNovelty:
      type: object
      properties:
        cluster_id:
          type: string
        run_id:
          type: string
          nullable: true
        novelty_score:
          type: number
        novelty_status:
          type: string
          enum: [new, continuation, merged, split, uncertain, noise]
        nearest_topic_id:
          type: string
          nullable: true
        features:
          type: object
          additionalProperties:
            type: number
