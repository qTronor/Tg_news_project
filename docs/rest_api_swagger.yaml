openapi: 3.0.3
info:
  title: TG News REST API
  version: 1.0.0
  description: >
    Unified Swagger/OpenAPI contract for TG News analytics and auth REST services.
    Auth service also exposes generated Swagger UI at /docs.
servers:
  - url: http://localhost:8080
    description: Analytics API
  - url: http://localhost:8000
    description: Auth API
tags:
  - name: health
  - name: analytics
  - name: topics
  - name: review
  - name: experiments
  - name: entities
  - name: annotation
  - name: datasets
  - name: training
  - name: models
  - name: auth
  - name: admin
  - name: reactions
  - name: sources

paths:
  /health:
    get:
      tags: [health]
      summary: Service health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      tags: [health]
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text metrics
          content:
            text/plain:
              schema:
                type: string

  /analytics/overview:
    get:
      tags: [analytics]
      summary: Dashboard KPI overview
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewStats"

  /analytics/overview/clusters:
    get:
      tags: [topics]
      summary: Topic cluster list
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/MinImportance"
        - $ref: "#/components/parameters/ImportanceLevel"
      responses:
        "200":
          description: Topic clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"

  /analytics/topics:
    get:
      tags: [topics]
      summary: Topic list alias for /analytics/overview/clusters
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/MinImportance"
        - $ref: "#/components/parameters/ImportanceLevel"
      responses:
        "200":
          description: Topic clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"

  /analytics/topics/novel:
    get:
      tags: [topics]
      summary: Novel topics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: min_score
          in: query
          schema:
            type: number
            format: float
            default: 0.55
      responses:
        "200":
          description: Novel topic list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"

  /analytics/topics/{clusterId}:
    get:
      tags: [topics]
      summary: Topic detail
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Topic detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/clusters/{clusterId}:
    get:
      tags: [topics]
      summary: Cluster detail alias for /analytics/topics/{clusterId}
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Cluster detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/clusters/{clusterId}/documents:
    get:
      tags: [topics]
      summary: Messages in a cluster
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Cluster messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /analytics/clusters/{clusterId}/first-source:
    get:
      tags: [topics]
      summary: First source and propagation chain for cluster
      parameters:
        - $ref: "#/components/parameters/ClusterId"
      responses:
        "200":
          description: First source payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirstSourcePayload"

  /analytics/topics/{clusterId}/similar:
    get:
      tags: [topics]
      summary: Similar topics
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Similar topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelatedTopic"

  /analytics/topics/{clusterId}/novelty:
    get:
      tags: [topics]
      summary: Topic novelty score
      parameters:
        - $ref: "#/components/parameters/ClusterId"
      responses:
        "200":
          description: Novelty result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicNovelty"

  /analytics/topics/{clusterId}/similar-history:
    get:
      tags: [topics]
      summary: Similar topics from history
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Historical similarity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicSimilarityHistoryItem"

  /analytics/clusters/{clusterId}/compare/{otherClusterId}:
    get:
      tags: [topics]
      summary: Compare two topic clusters
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: otherClusterId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Topic comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicComparisonResult"

  /analytics/clusters/{clusterId}/graph-metrics:
    get:
      tags: [topics]
      summary: Graph metrics for topic cluster
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Topic graph metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicGraphMetrics"

  /analytics/clusters/{clusterId}/timeline:
    get:
      tags: [topics]
      summary: Topic timeline
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Bucket"
      responses:
        "200":
          description: Timeline points and events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicTimeline"

  /analytics/clusters/{clusterId}/evolution-events:
    get:
      tags: [topics]
      summary: Topic evolution events
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Bucket"
      responses:
        "200":
          description: Evolution events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicTimelineEvent"

  /analytics/clusters/{clusterId}/llm/{enrichmentType}:
    get:
      tags: [topics]
      summary: LLM enrichment for topic
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/EnrichmentType"
      responses:
        "200":
          description: LLM enrichment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmEnrichmentResponse"

  /analytics/clusters/{clusterId}/llm/{enrichmentType}/refresh:
    post:
      tags: [topics]
      summary: Refresh LLM enrichment
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/EnrichmentType"
      responses:
        "200":
          description: Refreshed LLM enrichment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmEnrichmentResponse"

  /analytics/topics/{clusterId}/summary:
    get:
      tags: [topics]
      summary: Topic summary bundle
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - name: language
          in: query
          schema:
            type: string
            default: ru
      responses:
        "200":
          description: Topic summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicSummaryBundle"

  /analytics/topics/{clusterId}/summary/regenerate:
    post:
      tags: [topics]
      summary: Regenerate topic summary bundle
      parameters:
        - $ref: "#/components/parameters/ClusterId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  default: ru
      responses:
        "200":
          description: Regenerated topic summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicSummaryBundle"

  /analytics/entities/top:
    get:
      tags: [entities]
      summary: Top entities
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [PER, ORG, LOC, MISC]
        - name: cluster_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Top entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"

  /analytics/entities/{entityId}:
    get:
      tags: [entities]
      summary: Canonical entity by ID
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
        "302":
          description: Entity was merged into another entity
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/entities/{entityId}/aliases:
    get:
      tags: [entities]
      summary: Entity aliases
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Alias list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityAlias"

  /analytics/entities/{entityId}/timeline:
    get:
      tags: [entities]
      summary: Entity mention timeline
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Bucket"
      responses:
        "200":
          description: Entity mention timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityTimelinePoint"

  /analytics/entities/{entityId}/merge:
    post:
      tags: [entities]
      summary: Merge canonical entity into target entity
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityMergeRequest"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityMergeResult"

  /analytics/entities/normalization-rules:
    post:
      tags: [entities]
      summary: Create entity normalization rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NormalizationRuleInput"
      responses:
        "201":
          description: Created normalization rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NormalizationRule"

  /analytics/sentiment/dynamics:
    get:
      tags: [analytics]
      summary: Sentiment dynamics
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/Channel"
        - name: cluster_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sentiment time series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SentimentPoint"

  /analytics/messages:
    get:
      tags: [analytics]
      summary: Messages feed
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Channel"
        - name: topic
          in: query
          schema:
            type: string
        - name: sentiment
          in: query
          schema:
            type: string
            enum: [positive, neutral, negative]
        - name: entity
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /analytics/graph:
    get:
      tags: [analytics]
      summary: Graph data
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: focus
          in: query
          schema:
            type: string
        - name: depth
          in: query
          schema:
            type: integer
            default: 2
        - name: mode
          in: query
          schema:
            type: string
            enum: [overview, propagation]
            default: overview
        - name: cluster_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Graph nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphData"

  /analytics/review/topics:
    get:
      tags: [review]
      summary: Topic review tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            default: pending
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Review tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicReviewTask"
    post:
      tags: [review]
      summary: Request manual topic review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TopicReviewActionRequest"
                - type: object
                  required: [cluster_id]
                  properties:
                    cluster_id:
                      type: string
      responses:
        "200":
          description: Created review task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkTaskResponse"

  /analytics/review/topics/{id}/confirm:
    post:
      tags: [review]
      summary: Confirm topic label
      parameters:
        - $ref: "#/components/parameters/ReviewTaskId"
      requestBody:
        $ref: "#/components/requestBodies/TopicReviewAction"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /analytics/review/topics/{id}/rename:
    post:
      tags: [review]
      summary: Rename topic
      parameters:
        - $ref: "#/components/parameters/ReviewTaskId"
      requestBody:
        $ref: "#/components/requestBodies/TopicReviewAction"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /analytics/review/topics/{id}/merge:
    post:
      tags: [review]
      summary: Merge topic
      parameters:
        - $ref: "#/components/parameters/ReviewTaskId"
      requestBody:
        $ref: "#/components/requestBodies/TopicReviewAction"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /analytics/review/topics/{id}/split:
    post:
      tags: [review]
      summary: Split topic
      parameters:
        - $ref: "#/components/parameters/ReviewTaskId"
      requestBody:
        $ref: "#/components/requestBodies/TopicReviewAction"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /analytics/review/topics/{id}/reject:
    post:
      tags: [review]
      summary: Reject topic label
      parameters:
        - $ref: "#/components/parameters/ReviewTaskId"
      requestBody:
        $ref: "#/components/requestBodies/TopicReviewAction"
      responses:
        "200":
          $ref: "#/components/responses/Ok"

  /analytics/experiments/topics:
    get:
      tags: [experiments]
      summary: Topic modeling experiments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicExperiment"

  /analytics/experiments/topics/run:
    post:
      tags: [experiments]
      summary: Run topic modeling experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicExperimentRunRequest"
      responses:
        "201":
          description: Experiment run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicExperimentRunResponse"

  /analytics/experiments/topics/{experimentId}:
    get:
      tags: [experiments]
      summary: Topic experiment detail
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experiment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicExperiment"

  /analytics/experiments/topics/{experimentId}/metrics:
    get:
      tags: [experiments]
      summary: Topic experiment metrics
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Experiment metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicExperimentMetrics"

  /analytics/datasets:
    get:
      tags: [datasets]
      summary: Dataset versions
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Dataset versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetVersion"

  /analytics/datasets/build:
    post:
      tags: [datasets]
      summary: Build annotation dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetBuildRequest"
      responses:
        "201":
          description: Dataset build created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdStatusResponse"

  /analytics/datasets/{datasetId}/export:
    get:
      tags: [datasets]
      summary: Export dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, jsonl, octis, huggingface]
            default: jsonl
      responses:
        "200":
          description: Dataset file
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/x-ndjson:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary

  /analytics/annotation/tasks:
    get:
      tags: [annotation]
      summary: Annotation tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: dataset_id
          in: query
          schema:
            type: string
        - name: annotator_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Annotation tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnotationTask"

  /analytics/annotation/tasks/{taskId}:
    get:
      tags: [annotation]
      summary: Annotation task detail
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Annotation task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationTask"

  /analytics/annotation/tasks/{taskId}/label:
    post:
      tags: [annotation]
      summary: Submit annotation label
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelSubmitRequest"
      responses:
        "200":
          $ref: "#/components/responses/OkTask"

  /analytics/annotation/tasks/{taskId}/skip:
    post:
      tags: [annotation]
      summary: Skip annotation task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/OkTask"

  /analytics/annotation/stats:
    get:
      tags: [annotation]
      summary: Annotation statistics
      parameters:
        - name: dataset_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Annotation stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnotationStats"

  /analytics/annotation/guidelines:
    get:
      tags: [annotation]
      summary: Active annotation guidelines
      responses:
        "200":
          description: Annotation guidelines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationGuidelines"

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegister"
      responses:
        "201":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/login:
    post:
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh tokens
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Logout
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "204":
          description: Logged out

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user profile
      security:
