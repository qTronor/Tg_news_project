kafka:
  bootstrap_servers: "localhost:9092"
  consumer_group: "paper-detector-group"
  input_topic: "preprocessed.messages"
  output_topic: "paper.detected"
  dlq_topic: "dlq.paper"
  auto_offset_reset: "latest"
  max_poll_records: 50

postgres:
  dsn: "postgresql://postgres:password@localhost:5432/telegram_news"
  min_size: 2
  max_size: 10
  command_timeout: 30

service:
  host: "0.0.0.0"
  port: 8060
  metrics_port: 8061
  log_level: "INFO"
