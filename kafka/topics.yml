# Kafka Topics Configuration
# Description: Topic definitions for Telegram News Pipeline
# Version: 1.0.0
# Date: 2026-01-31

# Usage:
# kafka-topics.sh --bootstrap-server localhost:9092 --create --config-file kafka/topics.yml

---
topics:
  # =====================================================
  # Main Data Pipeline Topics
  # =====================================================
  
  - name: raw.telegram.messages
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      max.message.bytes: 10485760  # 10MB
      segment.ms: 86400000  # 1 day
    description: Raw messages collected from Telegram channels
    
  - name: persisted.messages
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 604800000  # 7 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Confirmation that messages were persisted to Postgres
    
  - name: preprocessed.messages
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Messages after text preprocessing
    
  - name: sentiment.enriched
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Messages enriched with sentiment analysis
    
  - name: ner.enriched
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Messages enriched with named entity recognition
    
  - name: graph.updates
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 604800000  # 7 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Graph update commands for Neo4j

  - name: topic.assignments
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Topic cluster assignments emitted by topic_clusterer

  - name: topic.novelty.candidates
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Explainable new-topic candidates emitted by topic_novelty_detector

  - name: training.jobs.requested
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: User-consented model training job requests

  - name: training.jobs.started
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 604800000  # 7 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Training job lifecycle event emitted when a job starts

  - name: training.jobs.completed
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Training job lifecycle event emitted after evaluation

  - name: training.jobs.failed
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000
    description: Failed training job lifecycle events

  - name: model.version.created
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Candidate model versions registered after training and evaluation

  - name: model.deployment.requested
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: User-consented deployment requests for accepted/candidate models

  - name: model.deployment.completed
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Completed model deployment lifecycle events
    
  # =====================================================
  # Scientific Paper Analysis Topics
  # =====================================================

  - name: paper.detected
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Scientific paper detection events from preprocessed messages

  - name: paper.parsed
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: Parsed scientific paper metadata and text

  - name: paper.summarized
    partitions: 6
    replication_factor: 3
    config:
      retention.ms: 2592000000  # 30 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 86400000
    description: LLM-generated structured summary of scientific papers

  - name: dlq.paper
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000
    description: Failed paper processing events (all stages)

  # =====================================================
  # Dead Letter Queue (DLQ) Topics
  # =====================================================

  - name: dlq.raw.messages
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days (longer retention for investigation)
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000  # 7 days
    description: Failed raw message processing
    
  - name: dlq.preprocessing
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000
    description: Failed preprocessing operations
    
  - name: dlq.sentiment
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000
    description: Failed sentiment analysis
    
  - name: dlq.ner
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000
    description: Failed NER extraction
    
  - name: dlq.graph
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000
    description: Failed graph updates

  - name: dlq.topic_clustering
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000
    description: Failed topic clustering operations

  - name: dlq.training
    partitions: 3
    replication_factor: 3
    config:
      retention.ms: 7776000000  # 90 days
      compression.type: lz4
      min.insync.replicas: 2
      cleanup.policy: delete
      segment.ms: 604800000
    description: Failed training orchestration events

# =====================================================
# Consumer Groups
# =====================================================

consumer_groups:
  - name: message-persister-group
    topics:
      - raw.telegram.messages
    description: Persists raw messages to Postgres
    
  - name: preprocessor-group
    topics:
      - raw.telegram.messages
      - persisted.messages
    description: Text preprocessing and cleaning
    
  - name: sentiment-analyzer-group
    topics:
      - preprocessed.messages
    description: Sentiment analysis and emotion detection
    
  - name: ner-extractor-group
    topics:
      - preprocessed.messages
    description: Named entity recognition and relation extraction
    
  - name: graph-builder-group
    topics:
      - sentiment.enriched
      - ner.enriched
    description: Builds knowledge graph updates

  - name: topic-clusterer-group
    topics:
      - preprocessed.messages
    description: Builds topic cluster assignments

  - name: training-orchestrator-group
    topics:
      - training.jobs.requested
    description: Orchestrates user-consented model training jobs

  - name: paper-detector-group
    topics:
      - preprocessed.messages
    description: Detects scientific papers in preprocessed messages

  - name: paper-parser-group
    topics:
      - paper.detected
    description: Parses metadata and text from detected papers

  - name: paper-summarizer-group
    topics:
      - paper.parsed
    description: Generates LLM summaries for parsed papers
    
  - name: neo4j-writer-group
    topics:
      - graph.updates
    description: Writes to Neo4j graph database
    
  - name: monitoring-group
    topics:
      - raw.telegram.messages
      - persisted.messages
      - preprocessed.messages
      - sentiment.enriched
      - ner.enriched
      - topic.assignments
      - topic.novelty.candidates
      - training.jobs.requested
      - training.jobs.started
      - training.jobs.completed
      - training.jobs.failed
      - model.version.created
      - model.deployment.requested
      - model.deployment.completed
      - graph.updates
    description: Monitoring and metrics collection
    
  - name: dlq-manual-review-group
    topics:
      - dlq.raw.messages
      - dlq.preprocessing
      - dlq.sentiment
      - dlq.ner
      - dlq.topic_clustering
      - dlq.training
      - dlq.graph
      - dlq.paper
    description: Manual review and retry of failed messages

# =====================================================
# Topic Creation Commands (for reference)
# =====================================================

# Main topics
# kafka-topics.sh --bootstrap-server localhost:9092 --create \
#   --topic raw.telegram.messages --partitions 6 --replication-factor 3 \
#   --config retention.ms=2592000000 --config compression.type=lz4 \
#   --config min.insync.replicas=2

# DLQ topics
# kafka-topics.sh --bootstrap-server localhost:9092 --create \
#   --topic dlq.raw.messages --partitions 3 --replication-factor 3 \
#   --config retention.ms=7776000000 --config compression.type=lz4 \
#   --config min.insync.replicas=2

# List all topics
# kafka-topics.sh --bootstrap-server localhost:9092 --list

# Describe a topic
# kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic raw.telegram.messages

# Delete a topic (use with caution!)
# kafka-topics.sh --bootstrap-server localhost:9092 --delete --topic <topic-name>
