kafka:
  bootstrap_servers: "localhost:9092"
  consumer_group: "paper-parser-group"
  input_topic: "paper.detected"
  output_topic: "paper.parsed"
  dlq_topic: "dlq.paper"
  auto_offset_reset: "latest"

postgres:
  dsn: "postgresql://postgres:password@localhost:5432/telegram_news"
  min_size: 2
  max_size: 10
  command_timeout: 60

service:
  host: "0.0.0.0"
  port: 8062
  metrics_port: 8063
  log_level: "INFO"
  http_timeout_seconds: 30
  max_full_text_chars: 100000
  summary_text_chars: 8000
